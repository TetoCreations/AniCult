<!doctype html>
<html lang="en">
  <!--
    AniCult — single-page application shell.
    Everything you see on screen is rendered client-side by app.js into
    <main id="app"> (hash-based router: #/, #/anime/:id, #/watch/:id, ...).
    No frameworks: vanilla JS + AniList GraphQL API + embedded video player.
  -->
  <head>
    <!-- ============ Core meta ============ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============ SEO ============ -->
    <title>AniCult — Free Anime Streaming | Browse & Watch Online</title>
    <link rel="canonical" href="https://anicult.vercel.app/" />

    <meta
      name="description"
      content="Watch anime free in your browser. Browse trending anime from AniList, stream instantly via Megavid embed, and track your progress. No ads, no sign-up, no setup."
    />
    <meta
      name="keywords"
      content="anime, free anime streaming, watch anime online, anicult, anime website, anime tracker, anilist, stream anime free, no ads anime, anime episodes"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AniCult" />
    <meta name="theme-color" content="#e63946" />

    <!-- ============ Icons (favicon.svg doubles as touch icon) ============ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- ============ Open Graph (link previews: Discord, Facebook, etc.) ============ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anicult.vercel.app/" />
    <meta property="og:title" content="AniCult | Free Anime Streaming" />
    <meta
      property="og:description"
      content="Browse and stream anime instantly with sub/dub support, autoplay, and watchlist tracking."
    />
    <meta property="og:site_name" content="AniCult" />
    <meta
      property="og:image"
      content="https://anicult.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ============ Twitter card (X link previews) ============ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://anicult.vercel.app/" />
    <meta name="twitter:title" content="AniCult | Free Anime Streaming" />
    <meta
      name="twitter:description"
      content="Watch anime free in your browser. Browse AniList, stream instantly, track progress. No ads, no sign-up."
    />
    <meta
      name="twitter:image"
      content="https://anicult.vercel.app/og-image.png"
    />

    <!-- ============ Fonts & styles ============ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- "?v=2" is a cache-buster — bump it after CSS changes in deploys -->
    <link rel="stylesheet" href="styles.css?v=2" />

    <!-- ============ Structured data (rich results / Google) ============ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AniCult",
        "url": "https://anicult.vercel.app/",
        "description": "Watch anime free in your browser. Browse trending anime from AniList, stream instantly via embedded player.",
        "applicationCategory": "Entertainment",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <!-- ============ Navbar (static shell; styling in styles.css §3) ============
         Links are hash routes handled by the router in app.js.
         #nav-toggle expands the mobile menu (#nav-links) on screens ≤ 960px. -->
    <nav class="nav">
      <a href="#/" class="nav-logo">AniCult</a>
      <button
        class="nav-toggle"
        id="nav-toggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="#/">Home</a>
        <a href="#/search?sort=TRENDING_DESC">Trending</a>
        <a href="#/search?sort=POPULARITY_DESC">Popular</a>
        <a href="#/watchlist">Watchlist</a>
        <a href="#/history">History</a>
        <a href="#/about">About</a>
      </div>
      <form class="nav-search" id="nav-search-form">
        <input
          type="text"
          placeholder="Search anime..."
          id="nav-search-input"
        />
        <button type="submit" id="nav-search-btn">Search</button>
      </form>
    </nav>

    <!-- ============ SPA mount point ============
         All pages (home, search, detail, watch, watchlist, history, about)
         are rendered into this element by app.js. -->
    <main class="main" id="app"></main>

    <!-- ============ App entry point ============ -->
    <script src="app.js"></script>
  </body>
</html>
